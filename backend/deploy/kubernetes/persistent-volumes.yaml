---
# Project AEGIS Persistent Volume Claims
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: aegis-uploads-pvc
  namespace: aegis
  labels:
    app: aegis
    component: backend
    storage-type: uploads
spec:
  accessModes:
  - ReadWriteMany
  storageClassName: "efs-storage"  # Adjust for your storage class
  resources:
    requests:
      storage: 100Gi

