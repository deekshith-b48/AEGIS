---
# Storage Class Definitions (if needed)
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: aegis-efs-storage
  labels:
    app: aegis
    storage-type: efs
provisioner: efs.csi.aws.com
parameters:
  provisioningMode: efs-ap
  fileSystemId: fs-12345678  # Replace with actual EFS ID
  directoryPerms: "777"
allowVolumeExpansion: true
volumeBindingMode: Immediate

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: aegis-fast-storage
  labels:
    app: aegis
    storage-type: fast
provisioner: kubernetes.io/aws-ebs
parameters:
  type: gp3
  iops: "3000"
  throughput: "125"
  encrypted: "true"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain

---
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: aegis-backup-storage
  labels:
    app: aegis
    storage-type: backup
provisioner: kubernetes.io/no-provisioner
parameters:
  type: gp3
  iops: "1000"
  throughput: "125"
  encrypted: "true"
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
reclaimPolicy: Retain