---
# Project AEGIS Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: aegis-backend
  namespace: aegis
  labels:
    app: aegis
    component: backend
    version: v2.0.0
  annotations:
    deployment.kubernetes.io/revision: "1"
    description: "Project AEGIS Backend API Server"
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 1
  selector:
    matchLabels:
      app: aegis
      component: backend
  template:
    metadata:
      labels:
        app: aegis
        component: backend
        version: v2.0.0
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "9090"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: aegis-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
      - name: aegis-backend
        image: aegis/backend:2.0.0
        imagePullPolicy: Always
        ports:
        - containerPort: 8000
          name: http
          protocol: TCP
        - containerPort: 9090
          name: metrics
          protocol: TCP
        env:
        - name: AEGIS_ENV
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: AEGIS_ENV
        - name: LOG_LEVEL
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: LOG_LEVEL
        - name: SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: SECRET_KEY
        - name: JWT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: JWT_SECRET_KEY
        - name: DB_HOST
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: DB_HOST
        - name: DB_PORT
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: DB_PORT
        - name: DB_NAME
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: DB_NAME
        - name: DB_USER
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: DB_USER
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: DB_PASSWORD
        - name: REDIS_HOST
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: REDIS_HOST
        - name: REDIS_PORT
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: REDIS_PORT
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: REDIS_PASSWORD
        - name: KAFKA_BOOTSTRAP_SERVERS
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: KAFKA_BOOTSTRAP_SERVERS
        - name: NPCI_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: NPCI_API_KEY
        - name: NPCI_API_SECRET
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: NPCI_API_SECRET
        - name: NCRP_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: NCRP_API_KEY
        - name: I4C_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: I4C_API_KEY
        - name: CFCFRMS_API_KEY
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: CFCFRMS_API_KEY
        - name: SMTP_USERNAME
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: SMTP_USERNAME
        - name: SMTP_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: SMTP_PASSWORD
        - name: TWILIO_ACCOUNT_SID
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: TWILIO_ACCOUNT_SID
        - name: TWILIO_AUTH_TOKEN
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: TWILIO_AUTH_TOKEN
        - name: GRAFANA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: aegis-secrets
              key: GRAFANA_PASSWORD
        - name: JAEGER_AGENT_HOST
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: JAEGER_AGENT_HOST
        - name: JAEGER_AGENT_PORT
          valueFrom:
            configMapKeyRef:
              name: aegis-config
              key: JAEGER_AGENT_PORT
        - name: POD_NAME
          valueFrom:
            fieldRef:
              fieldPath: metadata.name
        - name: POD_NAMESPACE
          valueFrom:
            fieldRef:
              fieldPath: metadata.namespace
        - name: POD_IP
          valueFrom:
            fieldRef:
              fieldPath: status.podIP
        resources:
          requests:
            memory: "512Mi"
            cpu: "250m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 60
          periodSeconds: 30
          timeoutSeconds: 10
          successThreshold: 1
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 3
        startupProbe:
          httpGet:
            path: /health
            port: 8000
            scheme: HTTP
          initialDelaySeconds: 10
          periodSeconds: 10
          timeoutSeconds: 5
          successThreshold: 1
          failureThreshold: 30
        volumeMounts:
        - name: config-volume
          mountPath: /app/config
          readOnly: true
        - name: ai-models-volume
          mountPath: /app/models
          readOnly: true
        - name: uploads-volume
          mountPath: /app/uploads
        - name: logs-volume
          mountPath: /app/logs
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: false
          capabilities:
            drop:
            - ALL
          runAsNonRoot: true
          runAsUser: 1000
        lifecycle:
          preStop:
            exec:
              command: ["/bin/sh", "-c", "sleep 15"]
      volumes:
      - name: config-volume
        configMap:
          name: aegis-config
      - name: ai-models-volume
        configMap:
          name: aegis-ai-models
      - name: uploads-volume
        persistentVolumeClaim:
          claimName: aegis-uploads-pvc
      - name: logs-volume
        persistentVolumeClaim:
          claimName: aegis-logs-pvc
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            podAffinityTerm:
              labelSelector:
                matchLabels:
                  app: aegis
                  component: backend
              topologyKey: kubernetes.io/hostname
      nodeSelector:
        kubernetes.io/os: linux
        node-type: application  # Custom node label for application pods
      tolerations:
      - key: "application"
        operator: "Equal"
        value: "true"
        effect: "NoSchedule"
      terminationGracePeriodSeconds: 60

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: aegis-backend-hpa
  namespace: aegis
  labels:
    app: aegis
    component: backend
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-backend
  minReplicas: 3
  maxReplicas: 20
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 10
        periodSeconds: 60
      - type: Pods
        value: 2
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      - type: Pods
        value: 4
        periodSeconds: 60
      selectPolicy: Max

---
# Vertical Pod Autoscaler (optional)
apiVersion: autoscaling.k8s.io/v1
kind: VerticalPodAutoscaler
metadata:
  name: aegis-backend-vpa
  namespace: aegis
  labels:
    app: aegis
    component: backend
spec:
  targetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: aegis-backend
  updatePolicy:
    updateMode: "Auto"
  resourcePolicy:
    containerPolicies:
    - containerName: aegis-backend
      minAllowed:
        cpu: 100m
        memory: 256Mi
      maxAllowed:
        cpu: 2000m
        memory: 4Gi
      controlledResources: ["cpu", "memory"]